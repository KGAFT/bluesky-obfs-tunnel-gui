[package]
name = "bluesky-obfs-t-gui"
version = "0.1.0"
edition = "2024"
description = "A responsive Slint client for Bluesky obfuscated tunnels"
default-run = "bluesky-obfs-t-gui"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bluesky-obfs-tunnel = { path = "../bluesky-obfs-tunnel", default-features = false }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
httparse = "1.10"
tempfile = "3"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-winit"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
slint = { version = "=1.18.1", default-features = false, features = ["backend-android-activity-06", "renderer-skia-opengl"] }

[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["renderer-skia"] }

[build-dependencies]
slint-build = "=1.18.1"
cc = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
i-slint-backend-testing = "=1.18.1"
png = "0.18"

[package.metadata.android]
package = "app.bluesky.tunnel"
apk_name = "bluesky-tunnel"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Bluesky Tunnel"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
