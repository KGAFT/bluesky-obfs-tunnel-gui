name: BlueskyTunnel
options:
  bundleIdPrefix: app.bluesky
settings:
  ENABLE_USER_SCRIPT_SANDBOXING: NO
  PRODUCT_BUNDLE_IDENTIFIER: app.bluesky.tunnel
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  BlueskyTunnel:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    settings:
      TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Bluesky Tunnel
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Connect to your tunnel server on your local network.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Slint
                UISceneDelegateClassName: SlintWindowSceneDelegate
    sources: []
    postCompileScripts:
      - name: Build Rust application
        script: bash "$SRCROOT/../scripts/ios.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
